<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đua Xe Né Chướng Ngại</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.game {
    width: 100%;
    max-width: 520px;
    text-align: center;
}

h1 {
    color: #ffd54a;
    margin-bottom: 10px;
    text-shadow: 0 0 10px #ff9800;
}

.info {
    display: flex;
    justify-content: space-between;
    background: #222;
    border: 2px solid #444;
    border-radius: 12px;
    padding: 10px 15px;
    margin-bottom: 10px;
    font-size: 18px;
    font-weight: bold;
}

#score {
    color: #4cff73;
}

#best {
    color: #ffd54a;
}

#speed {
    color: #54c7ff;
}

.road {
    position: relative;
    width: 100%;
    height: 650px;
    max-height: 72vh;
    overflow: hidden;
    border: 5px solid #555;
    border-radius: 18px;
    background:
        linear-gradient(
            90deg,
            #303030 0%,
            #383838 15%,
            #202020 15%,
            #202020 85%,
            #383838 85%,
            #303030 100%
        );
    box-shadow:
        0 0 30px rgba(0,0,0,.8),
        inset 0 0 30px rgba(0,0,0,.7);
}

/* Vạch đường */
.lane-line {
    position: absolute;
    width: 8px;
    height: 70px;
    background: #fff;
    opacity: .8;
    border-radius: 5px;
}

.line1 {
    left: 33.33%;
}

.line2 {
    left: 66.66%;
}

/* Xe người chơi */
.player {
    position: absolute;
    width: 55px;
    height: 95px;
    bottom: 35px;
    left: calc(50% - 27.5px);
    z-index: 10;
    transition: left .08s;
}

/* Thân xe */
.player .body {
    position: absolute;
    width: 55px;
    height: 80px;
    top: 10px;
    background: linear-gradient(
        90deg,
        #0066ff,
        #32a8ff,
        #0052d6
    );
    border-radius: 14px 14px 10px 10px;
    border: 3px solid #9bdcff;
    box-shadow: 0 0 15px rgba(0,130,255,.8);
}

/* Kính */
.player .window {
    position: absolute;
    width: 38px;
    height: 25px;
    top: 18px;
    left: 8px;
    background: linear-gradient(
        135deg,
        #bff5ff,
        #247aa0
    );
    border-radius: 8px 8px 4px 4px;
    border: 2px solid #d8ffff;
}

/* Đèn */
.player .light {
    position: absolute;
    width: 10px;
    height: 8px;
    background: #fff;
    border-radius: 3px;
    top: 70px;
    box-shadow: 0 0 8px white;
}

.player .light.left {
    left: 7px;
}

.player .light.right {
    right: 7px;
}

/* Bánh xe */
.wheel {
    position: absolute;
    width: 12px;
    height: 28px;
    background: #050505;
    border-radius: 5px;
    z-index: -1;
}

.wheel.left1 {
    left: -7px;
    top: 18px;
}

.wheel.left2 {
    left: -7px;
    top: 60px;
}

.wheel.right1 {
    right: -7px;
    top: 18px;
}

.wheel.right2 {
    right: -7px;
    top: 60px;
}

/* Xe địch */
.enemy {
    position: absolute;
    width: 55px;
    height: 95px;
    z-index: 8;
}

.enemy .body {
    position: absolute;
    width: 55px;
    height: 80px;
    top: 10px;
    background: linear-gradient(
        90deg,
        #d50000,
        #ff4444,
        #a50000
    );
    border-radius: 14px 14px 10px 10px;
    border: 3px solid #ff9999;
    box-shadow: 0 0 15px rgba(255,0,0,.6);
}

.enemy .window {
    position: absolute;
    width: 38px;
    height: 25px;
    top: 18px;
    left: 8px;
    background: #263c49;
    border-radius: 8px 8px 4px 4px;
    border: 2px solid #9aa;
}

.enemy .light {
    position: absolute;
    width: 10px;
    height: 8px;
    background: #ff3333;
    border-radius: 3px;
    bottom: 12px;
}

.enemy .light.left {
    left: 7px;
}

.enemy .light.right {
    right: 7px;
}

/* Màn hình bắt đầu / game over */
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.78);
    z-index: 50;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 20px;
}

.overlay h2 {
    font-size: 40px;
    color: #ffd54a;
    margin-bottom: 15px;
    text-shadow: 0 0 15px #ff9800;
}

.overlay p {
    font-size: 18px;
    color: #ddd;
    margin-bottom: 20px;
    line-height: 1.6;
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
    border-radius: 12px;
    padding: 15px 30px;
    font-size: 18px;
    background: linear-gradient(#ffd54a, #e69b00);
    color: #221500;
    box-shadow: 0 5px 15px rgba(255,180,0,.3);
    transition: .2s;
}

button:hover {
    transform: scale(1.05);
}

button:active {
    transform: scale(.95);
}

/* Nút điều khiển */
.controls {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 12px;
}

.control-btn {
    width: 100px;
    height: 55px;
    padding: 0;
    font-size: 30px;
    background: #333;
    color: white;
    border: 2px solid #777;
    touch-action: manipulation;
}

.control-btn:hover {
    background: #444;
}

/* Hiệu ứng va chạm */
.explosion {
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        #fff,
        #ffdd00,
        #ff6600,
        transparent
    );
    animation: explode .5s forwards;
    z-index: 30;
    pointer-events: none;
}

@keyframes explode {
    0% {
        transform: scale(.3);
        opacity: 1;
    }

    100% {
        transform: scale(2);
        opacity: 0;
    }
}

.hidden {
    display: none !important;
}

.help {
    color: #aaa;
    font-size: 13px;
    margin-top: 8px;
}

@media (max-width: 600px) {

    body {
        align-items: flex-start;
        padding-top: 10px;
    }

    .game {
        width: 96%;
    }

    h1 {
        font-size: 27px;
    }

    .road {
        height: 600px;
        max-height: 70vh;
    }

    .info {
        font-size: 14px;
    }

    .control-btn {
        width: 110px;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>🏎️ ĐUA XE</h1>

    <div class="info">
        <div>Điểm: <span id="score">0</span></div>
        <div>Tốc độ: <span id="speed">1</span></div>
        <div>Kỷ lục: <span id="best">0</span></div>
    </div>

    <div class="road" id="road">

        <!-- Vạch đường -->
        <div class="lane-line line1" id="line1"></div>
        <div class="lane-line line2" id="line2"></div>

        <!-- Xe người chơi -->
        <div class="player" id="player">

            <div class="wheel left1"></div>
            <div class="wheel left2"></div>
            <div class="wheel right1"></div>
            <div class="wheel right2"></div>

            <div class="body"></div>
            <div class="window"></div>

            <div class="light left"></div>
            <div class="light right"></div>

        </div>

        <!-- Màn hình -->
        <div class="overlay" id="overlay">

            <h2 id="overlayTitle">
                🏁 ĐUA XE
            </h2>

            <p id="overlayText">
                Né những chiếc xe phía trước!<br>
                Dùng ← → hoặc nút điều khiển.
            </p>

            <button id="startBtn">
                ▶ BẮT ĐẦU
            </button>

        </div>

    </div>

    <div class="controls">

        <button
            class="control-btn"
            id="leftBtn">
            ◀
        </button>

        <button
            class="control-btn"
            id="rightBtn">
            ▶
        </button>

    </div>

    <div class="help">
        Máy tính: dùng phím ← → &nbsp; | &nbsp;
        Điện thoại: chạm nút ◀ ▶
    </div>

</div>


<script>

/* ==========================================
   CÀI ĐẶT GAME
========================================== */

const road = document.getElementById("road");
const player = document.getElementById("player");

const scoreEl = document.getElementById("score");
const speedEl = document.getElementById("speed");
const bestEl = document.getElementById("best");

const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");
const startBtn = document.getElementById("startBtn");

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");

const line1 = document.getElementById("line1");
const line2 = document.getElementById("line2");


/* ==========================================
   BIẾN GAME
========================================== */

let gameRunning = false;

let score = 0;

let best =
    Number(localStorage.getItem("carBestScore")) || 0;

let speed = 5;

let playerX = 0;

let enemies = [];

let roadLines = [];

let lastTime = 0;

let enemyTimer = 0;

let animationId;


/* ==========================================
   HIỂN THỊ KỶ LỤC
========================================== */

bestEl.textContent = best;


/* ==========================================
   LẤY VỊ TRÍ XE
========================================== */

function updatePlayerPosition() {

    player.style.left =
        playerX + "px";

}


/* ==========================================
   KHỞI TẠO VẠCH ĐƯỜNG
========================================== */

function createRoadLines() {

    roadLines = [];

    for (let i = 0; i < 8; i++) {

        const line = document.createElement("div");

        line.className = "lane-line";

        line.style.left = "50%";

        line.style.top =
            (i * 100 - 100) + "px";

        road.appendChild(line);

        roadLines.push(line);
    }
}


/* ==========================================
   DI CHUYỂN VẠCH ĐƯỜNG
========================================== */

function moveRoadLines(delta) {

    roadLines.forEach(line => {

        let top =
            parseFloat(line.style.top);

        top += speed * delta * 0.35;

        if (top > road.clientHeight) {
            top = -100;
        }

        line.style.top = top + "px";

    });

}


/* ==========================================
   TẠO XE ĐỊCH
========================================== */

function createEnemy() {

    const enemy = document.createElement("div");

    enemy.className = "enemy";


    /* Chọn làn ngẫu nhiên */

    const lanes = [0, 1, 2];

    const lane =
        lanes[
            Math.floor(
                Math.random() * lanes.length
            )
        ];


    const laneWidth =
        road.clientWidth / 3;


    const x =
        lane * laneWidth +
        (laneWidth - 55) / 2;


    enemy.style.left =
        x + "px";

    enemy.style.top =
        "-120px";


    enemy.innerHTML = `

        <div class="body"></div>
        <div class="window"></div>

        <div class="light left"></div>
        <div class="light right"></div>

    `;


    road.appendChild(enemy);


    enemies.push({

        element: enemy,

        x: x,

        y: -120

    });

}


/* ==========================================
   DI CHUYỂN XE ĐỊCH
========================================== */

function moveEnemies(delta) {

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy =
            enemies[i];


        enemy.y +=
            speed * delta * 0.5;


        enemy.element.style.top =
            enemy.y + "px";


        /* Xe đi khỏi màn hình */

        if (
            enemy.y >
            road.clientHeight + 120
        ) {

            enemy.element.remove();

            enemies.splice(i, 1);

            score++;

            scoreEl.textContent =
                score;


            /* Tăng tốc theo điểm */

            if (
                score % 5 === 0
            ) {

                speed += 0.5;

                speedEl.textContent =
                    speed.toFixed(1);

            }

        }

    }

}


/* ==========================================
   KIỂM TRA VA CHẠM
========================================== */

function checkCollision() {

    const playerRect =
        player.getBoundingClientRect();


    for (const enemy of enemies) {

        const enemyRect =
            enemy.element.getBoundingClientRect();


        const padding = 8;


        const hit =

            playerRect.left + padding <
            enemyRect.right - padding &&

            playerRect.right - padding >
            enemyRect.left + padding &&

            playerRect.top + padding <
            enemyRect.bottom - padding &&

            playerRect.bottom - padding >
            enemyRect.top + padding;


        if (hit) {

            createExplosion(
                player.offsetLeft + 27,
                player.offsetTop + 40
            );

            gameOver();

            return true;

        }

    }


    return false;

}


/* ==========================================
   HIỆU ỨNG NỔ
========================================== */

function createExplosion(x, y) {

    const explosion =
        document.createElement("div");

    explosion.className =
        "explosion";

    explosion.style.left =
        (x - 40) + "px";

    explosion.style.top =
        (y - 40) + "px";

    road.appendChild(explosion);


    setTimeout(() => {

        explosion.remove();

    }, 600);

}


/* ==========================================
   DI CHUYỂN XE
========================================== */

function moveLeft() {

    if (!gameRunning) return;


    const laneWidth =
        road.clientWidth / 3;


    playerX -= laneWidth;


    const minX = 10;


    if (playerX < minX) {
        playerX = minX;
    }


    updatePlayerPosition();

}


function moveRight() {

    if (!gameRunning) return;


    const laneWidth =
        road.clientWidth / 3;


    playerX += laneWidth;


    const maxX =
        road.clientWidth -
        player.offsetWidth -
        10;


    if (playerX > maxX) {
        playerX = maxX;
    }


    updatePlayerPosition();

}


/* ==========================================
   BÀN PHÍM
========================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {

            event.preventDefault();

            moveLeft();

        }


        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {

            event.preventDefault();

            moveRight();

        }

    }
);


/* ==========================================
   NÚT ĐIỀU KHIỂN
========================================== */

leftBtn.addEventListener(
    "click",
    moveLeft
);

rightBtn.addEventListener(
    "click",
    moveRight
);


/* ==========================================
   TOUCH / MOBILE
========================================== */

leftBtn.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        moveLeft();

    },
    { passive: false }
);


rightBtn.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        moveRight();

    },
    { passive: false }
);


/* ==========================================
   TẠO XE THEO THỜI GIAN
========================================== */

function spawnEnemies(delta) {

    enemyTimer += delta;


    /*
        Ban đầu khoảng 1.2 giây xuất hiện
        một xe.
        Càng chơi lâu càng nhanh.
    */

    const interval =
        Math.max(
            550,
            1300 - score * 12
        );


    if (enemyTimer >= interval) {

        enemyTimer = 0;

        createEnemy();

    }

}


/* ==========================================
   GAME LOOP
========================================== */

function gameLoop(timestamp) {

    if (!gameRunning) {
        return;
    }


    if (!lastTime) {
        lastTime = timestamp;
    }


    const delta =
        timestamp - lastTime;


    lastTime = timestamp;


    moveRoadLines(delta);

    spawnEnemies(delta);

    moveEnemies(delta);


    if (checkCollision()) {
        return;
    }


    animationId =
        requestAnimationFrame(
            gameLoop
        );

}


/* ==========================================
   XÓA XE CŨ
========================================== */

function clearEnemies() {

    enemies.forEach(enemy => {

        enemy.element.remove();

    });

    enemies = [];

}


/* ==========================================
   GAME OVER
========================================== */

function gameOver() {

    gameRunning = false;


    cancelAnimationFrame(
        animationId
    );


    /* Kỷ lục */

    if (score > best) {

        best = score;

        localStorage.setItem(
            "carBestScore",
            best
        );

        bestEl.textContent =
            best;

    }


    overlay.classList.remove(
        "hidden"
    );


    overlayTitle.textContent =
        "💥 GAME OVER";


    overlayText.innerHTML =

        "Bạn đã đâm vào xe khác!<br>" +

        "Điểm của bạn: <b>" +
        score +
        "</b><br>" +

        "Kỷ lục: <b>" +
        best +
        "</b>";


    startBtn.textContent =
        "🔄 CHƠI LẠI";

}


/* ==========================================
   BẮT ĐẦU GAME
========================================== */

function startGame() {

    gameRunning = true;

    score = 0;

    speed = 5;

    enemyTimer = 0;

    lastTime = 0;


    scoreEl.textContent =
        "0";

    speedEl.textContent =
        "5";


    clearEnemies();


    /*
        Đưa xe về làn giữa
    */

    const laneWidth =
        road.clientWidth / 3;


    playerX =
        laneWidth +
        (laneWidth -
        player.offsetWidth) / 2;


    updatePlayerPosition();


    overlay.classList.add(
        "hidden"
    );


    animationId =
        requestAnimationFrame(
            gameLoop
        );

}


/* ==========================================
   NÚT START
========================================== */

startBtn.addEventListener(
    "click",
    startGame
);


/* ==========================================
   KHỞI TẠO
========================================== */

createRoadLines();


/*
    Đặt xe ở giữa khi mới mở game
*/

const initialLane =
    road.clientWidth / 3;

playerX =
    initialLane +
    (initialLane -
    player.offsetWidth) / 2;

updatePlayerPosition();

</script>

</body>
</html>
