<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Bida 🎱</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #111827, #263238);
    font-family: Arial, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 95%;
    max-width: 900px;
    text-align: center;
}

h1 {
    margin: 10px;
    color: #ffd54a;
    text-shadow: 2px 2px 5px black;
}

.info {
    display: flex;
    justify-content: space-around;
    background: #111;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    font-size: 18px;
}

.table {
    position: relative;
    width: 100%;
    max-width: 820px;
    height: 470px;
    margin: auto;
    background: #08783e;
    border: 25px solid #6b3e1e;
    border-radius: 25px;
    box-shadow:
        0 10px 25px rgba(0,0,0,.5),
        inset 0 0 20px rgba(0,0,0,.4);
    overflow: hidden;
}

/* Các lỗ */
.hole {
    position: absolute;
    width: 42px;
    height: 42px;
    background: #050505;
    border-radius: 50%;
    box-shadow: inset 0 0 8px #555;
    z-index: 2;
}

.h1 { left: -15px; top: -15px; }
.h2 { right: -15px; top: -15px; }
.h3 { left: -15px; bottom: -15px; }
.h4 { right: -15px; bottom: -15px; }
.h5 { left: 50%; top: -21px; transform: translateX(-50%); }
.h6 { left: 50%; bottom: -21px; transform: translateX(-50%); }

/* Bi */
.ball {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    z-index: 5;
    box-shadow:
        inset -5px -5px 7px rgba(0,0,0,.35),
        inset 4px 4px 5px rgba(255,255,255,.5),
        2px 3px 4px rgba(0,0,0,.35);
}

.ball::after {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    background: rgba(255,255,255,.8);
    border-radius: 50%;
    top: 5px;
    left: 6px;
}

.white {
    background: white;
}

.red {
    background: #e53935;
}

.yellow {
    background: #ffd600;
}

.blue {
    background: #2979ff;
}

.purple {
    background: #8e24aa;
}

.orange {
    background: #fb8c00;
}

.green {
    background: #43a047;
}

.black {
    background: #111;
}

/* Đường ngắm */
.aim-line {
    position: absolute;
    height: 2px;
    background: rgba(255,255,255,.7);
    transform-origin: left center;
    pointer-events: none;
    z-index: 3;
}

/* Gậy */
.cue {
    position: absolute;
    height: 5px;
    background: linear-gradient(to right, #d8a15c, #f5d19a);
    transform-origin: left center;
    z-index: 1;
    border-radius: 5px;
    display: none;
}

.controls {
    margin-top: 15px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    margin: 5px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
}

#hit {
    background: #e53935;
    color: white;
    font-size: 20px;
    padding: 14px 35px;
}

#reset {
    background: #555;
    color: white;
}

.power-box {
    width: 300px;
    height: 20px;
    margin: 10px auto;
    background: #333;
    border: 2px solid white;
    border-radius: 20px;
    overflow: hidden;
}

.power {
    width: 50%;
    height: 100%;
    background: linear-gradient(
        90deg,
        #24c96b,
        #ffd600,
        #f44336
    );
}

.message {
    min-height: 28px;
    color: #ffd54a;
    font-weight: bold;
    margin-top: 5px;
}

.help {
    color: #bbb;
    font-size: 14px;
    margin-top: 8px;
}
</style>
</head>

<body>

<div class="game">

<h1>🎱 GAME BIDA 🎱</h1>

<div class="info">
    <div>🏆 Điểm: <span id="score">0</span></div>
    <div>🎯 Lượt: <span id="shots">0</span></div>
    <div>⭐ Kỷ lục: <span id="best">0</span></div>
</div>

<div class="table" id="table">

    <!-- Lỗ -->
    <div class="hole h1"></div>
    <div class="hole h2"></div>
    <div class="hole h3"></div>
    <div class="hole h4"></div>
    <div class="hole h5"></div>
    <div class="hole h6"></div>

    <!-- Bi -->
    <div class="ball white" id="cueBall"></div>

    <div class="ball red" style="left: 62%; top: 42%;"></div>
    <div class="ball yellow" style="left: 66%; top: 38%;"></div>
    <div class="ball blue" style="left: 66%; top: 46%;"></div>
    <div class="ball purple" style="left: 70%; top: 42%;"></div>
    <div class="ball orange" style="left: 70%; top: 50%;"></div>
    <div class="ball green" style="left: 74%; top: 38%;"></div>
    <div class="ball black" style="left: 74%; top: 46%;"></div>

    <div class="aim-line" id="aimLine"></div>
    <div class="cue" id="cue"></div>

</div>

<div class="message" id="message">
    Kéo chuột trên bàn để ngắm 🎯
</div>

<div class="power-box">
    <div class="power" id="power"></div>
</div>

<div class="controls">
    <button id="hit" onclick="hitBall()">🎱 ĐÁNH BI</button>
    <button id="reset" onclick="resetGame()">🔄 Chơi lại</button>
</div>

<div class="help">
    🖱️ Di chuyển chuột để chọn hướng • Thanh lực tự động chạy • Bấm ĐÁNH BI
</div>

</div>

<script>

const table = document.getElementById("table");
const cueBall = document.getElementById("cueBall");
const aimLine = document.getElementById("aimLine");
const cue = document.getElementById("cue");
const powerBar = document.getElementById("power");
const message = document.getElementById("message");

let score = 0;
let shots = 0;
let best = Number(localStorage.getItem("bidaBest")) || 0;

let angle = 0;
let power = 50;
let powerUp = true;
let canShoot = true;

document.getElementById("best").textContent = best;


// ============================
// THANH LỰC
// ============================

setInterval(() => {

    if (!canShoot) return;

    if (powerUp) {
        power += 2;

        if (power >= 100) {
            power = 100;
            powerUp = false;
        }

    } else {

        power -= 2;

        if (power <= 10) {
            power = 10;
            powerUp = true;
        }
    }

    powerBar.style.width = power + "%";

}, 50);


// ============================
// NGẮM
// ============================

table.addEventListener("mousemove", function(e) {

    if (!canShoot) return;

    const rect = table.getBoundingClientRect();

    const ballX =
        cueBall.offsetLeft + 14;

    const ballY =
        cueBall.offsetTop + 14;

    const mouseX =
        e.clientX - rect.left;

    const mouseY =
        e.clientY - rect.top;

    const dx = mouseX - ballX;
    const dy = mouseY - ballY;

    angle = Math.atan2(dy, dx);

    const distance = 160;

    aimLine.style.display = "block";
    aimLine.style.left = ballX + "px";
    aimLine.style.top = ballY + "px";
    aimLine.style.width = distance + "px";
    aimLine.style.transform =
        `rotate(${angle}rad)`;

    cue.style.display = "block";
    cue.style.left =
        (ballX - 150 * Math.cos(angle)) + "px";

    cue.style.top =
        (ballY - 150 * Math.sin(angle)) + "px";

    cue.style.width = "150px";

    cue.style.transform =
        `rotate(${angle}rad)`;

});


// ============================
// ĐÁNH BI
// ============================

function hitBall() {

    if (!canShoot) return;

    canShoot = false;
    shots++;

    document.getElementById("shots").textContent =
        shots;

    aimLine.style.display = "none";
    cue.style.display = "none";

    const strength =
        80 + power * 2;

    const startX = cueBall.offsetLeft;
    const startY = cueBall.offsetTop;

    const targetX =
        startX + Math.cos(angle) * strength;

    const targetY =
        startY + Math.sin(angle) * strength;

    cueBall.style.transition =
        "left .7s ease-out, top .7s ease-out";

    cueBall.style.left =
        Math.max(0, Math.min(100, targetX)) + "px";

    cueBall.style.top =
        Math.max(0, Math.min(100, targetY)) + "px";


    // Kiểm tra ngẫu nhiên xem bi có vào lỗ không
    const chance =
        0.25 + power / 250;

    setTimeout(() => {

        if (Math.random() < chance) {

            score += 10;

            message.textContent =
                "🔥 VÀO LỖ! +10 ĐIỂM";

            document.getElementById("score").textContent =
                score;

            if (score > best) {

                best = score;

                localStorage.setItem(
                    "bidaBest",
                    best
                );

                document.getElementById("best").textContent =
                    best;
            }

            // Đưa bi cái về vị trí mới
            cueBall.style.left = "25%";
            cueBall.style.top = "55%";

        } else {

            message.textContent =
                "😅 Trượt rồi! Thử lại.";

        }

        setTimeout(() => {

            cueBall.style.transition = "none";
            canShoot = true;

        }, 500);

    }, 750);
}


// ============================
// CHƠI LẠI
// ============================

function resetGame() {

    score = 0;
    shots = 0;

    document.getElementById("score").textContent = 0;
    document.getElementById("shots").textContent = 0;

    cueBall.style.transition = "none";
    cueBall.style.left = "25%";
    cueBall.style.top = "55%";

    aimLine.style.display = "none";
    cue.style.display = "none";

    message.textContent =
        "Kéo chuột trên bàn để ngắm 🎯";

    canShoot = true;
}


// ============================
// BÀN PHÍM
// ============================

document.addEventListener("keydown", function(e) {

    if (e.code === "Space") {
        e.preventDefault();
        hitBall();
    }

});

</script>

</body>
</html>
